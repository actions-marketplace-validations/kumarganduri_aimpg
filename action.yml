name: AI Coding MPG
description: AI cost and energy of pull requests and of your team (cost per working change), from aimpg git notes
author: Kumar Ganduri
branding:
  icon: zap
  color: green
inputs:
  mode:
    description: "pr: AI cost of this pull request · rollup: team cost per working change and waste ratio"
    default: pr
  comment:
    description: "pr mode: also post or update a comment on the pull request (needs permissions: pull-requests: write)"
    default: "false"
  days:
    description: "rollup mode: period in days"
    default: "90"
  min-group:
    description: "rollup mode: people who must share notes before team numbers show"
    default: "5"
  path:
    description: "repo folder (checked out with fetch-depth: 0)"
    default: "."
outputs:
  markdown-file:
    description: path of the generated markdown
    value: ${{ steps.run.outputs.file }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6, pinned: users run this with their repo's token
      with:
        version: "0.11.29"
    - name: fetch aimpg notes
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        git fetch --quiet origin '+refs/notes/aimpg:refs/notes/aimpg' || echo "No aimpg notes on origin yet (developers add them with aimpg notes push)"
    - name: aimpg
      id: run
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        MODE: ${{ inputs.mode }}
        DAYS: ${{ inputs.days }}
        MIN_GROUP: ${{ inputs.min-group }}
        BASE_REF: ${{ github.base_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/aimpg-$MODE.md"
        team() {  # aimpg prints its errors to stderr, so they reach this log rather than the markdown file
          uvx --quiet --from "$ACTION_PATH" aimpg team "$@" > "$out" \
            || { echo "::error::aimpg team $1 failed: see the message above"; exit 1; }
        }
        case "$MODE" in
          pr)
            if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"
            else base="$(git symbolic-ref -q --short refs/remotes/origin/HEAD || echo origin/main)"; fi
            team pr --repo . --base "$base" ;;
          rollup)
            team rollup --repo . --days "$DAYS" --min-group "$MIN_GROUP" ;;
          *) echo "::error::mode must be pr or rollup"; exit 1 ;;
        esac
        cat "$out" >> "$GITHUB_STEP_SUMMARY"
        echo "file=$out" >> "$GITHUB_OUTPUT"
    - name: comment on the pull request
      if: inputs.mode == 'pr' && inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        FILE: ${{ steps.run.outputs.file }}
      run: |
        # Edit only aimpg's own comment, found by its hidden marker: other bots post as the same user.
        post() {
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- aimpg:pr -->"))) | .id' \
            | tail -n 1)" || return 1
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$FILE" > /dev/null
          else gh pr comment "$PR" --body-file "$FILE"; fi
        }
        post || echo "::warning::Couldn't comment (pull requests from forks get a read-only token); the summary above has the numbers."
